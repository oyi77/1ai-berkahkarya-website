name: deploy-berkahkarya-site

# NOTE: no push trigger — the GitHub account is currently locked due to a
# billing issue, so push-triggered runs fail before any job starts. Keep this
# manual for when Actions is re-enabled; nightly automation lives in the
# local cron (scripts/nightly-property-refresh.sh) until then.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # No screener DB in CI: prebuild warns and keeps the committed snapshot.
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          npx wrangler pages deploy out --project-name=berkahkarya-site --branch=main --commit-dirty=true
